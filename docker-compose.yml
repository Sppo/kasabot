services:
  postgres:
    image: postgres:17-alpine
    container_name: kasabot-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kasabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD у .env}
      POSTGRES_DB: ${POSTGRES_DB:-kasabot}
    volumes:
      - kasabot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasabot} -d ${POSTGRES_DB:-kasabot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kasabot_pgdata:
